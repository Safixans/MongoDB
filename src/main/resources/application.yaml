spring:
  datasource:
    url: jdbc:h2:mem:~
    username: sa
    password: sa
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data: ## default it uses host: localhost and port: 6379
    redis:
      host: localhost
      port: 6379
  cache: ## this for time to live of data which is stored to redis
    redis:
      time-to-live: 10m
